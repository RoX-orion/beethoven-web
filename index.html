<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Noto+Sans+SC:100,300,400,500,700,900">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Beethoven Music Web"/>
    <link rel="apple-touch-icon" href="/favicon.ico" sizes="180x180"/>
    <link rel="mask-icon" href="/favicon.ico" color="#FFFFFF"/>
    <meta name="theme-color" content="#f7fbff"/>
    <meta name="google" content="notranslate">
    <title>Beethoven Music Web</title>
  </head>
  <body>
  <script>
    (() => {
      const saved = localStorage.getItem('beethoven-dark-mode');
      const dark = saved === 'true' || (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
      document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#080d16' : '#f7fbff');
    })();
  </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
